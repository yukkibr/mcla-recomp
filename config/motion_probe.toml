# Optional, read-only camera/target movement probe.
# MCLA sub_8231CE30: 0x8231CEE0 is the first instruction after the optional
# 0x8231B4E0/0x8231B740 camera-collision passes. r31 is the camera state.
# The same point is documented and used for reverse engineering by LARecomp.
# This does not change vehicle physics, camera matrices or guest time.
[[midasm_hook]]
name = "mcla_camera_motion_post"
address = 0x8231CEE0
registers = ["r31"]

# sub_8220AA68 @0x8220AA88: r30 is the render-source matrix, immediately
# after mr r30,r4 and before it is read and composed for camera effects.
# Compare movement here to the earlier camera-state rig (read-only).
[[midasm_hook]]
name = "mcla_camera_motion_publish"
address = 0x8220AA88
registers = ["r30"]
